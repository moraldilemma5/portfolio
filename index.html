<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTFOLIO</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white overflow-x-hidden">

  <!-- 左上：ブランド映像 -->
  <div class="fixed top-5 left-5 sm:top-7 sm:left-9 z-20 w-28 sm:w-40">
    <video src="実績/aoiyamada.mp4" autoplay muted loop playsinline class="w-full h-auto"></video>
  </div>

  <main class="min-h-screen flex flex-col items-center justify-center gap-10 sm:gap-12 px-6">

    <!-- メインビデオ（video3 をクリックすると video1 を screen 合成で重ねて表示／再クリックで非表示） -->
    <div id="videoStack" class="relative w-[78vw] sm:w-[58vw] max-w-[760px] -rotate-1 cursor-pointer">
      <video autoplay muted loop playsinline class="w-full h-auto block screen-video">
        <source src="video3.mp4" type="video/mp4">
      </video>
      <video id="overlayVideo" autoplay muted loop playsinline
             class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-1/2 h-auto object-contain screen-video opacity-0 transition-opacity duration-500 pointer-events-none">
        <source src="video1.mp4" type="video/mp4">
      </video>
    </div>

    <!-- ナビ（黒字 → ホバー/スクロールで画面右端から白背景） -->
    <nav class="w-full flex flex-col items-end gap-1 sm:gap-2 pr-2 sm:pr-10 mt-12 sm:mt-0">
      <a href="works.html" class="reveal-link text-base sm:text-8xl font-normal tracking-[0.12em]">
        <span class="reveal-bg"></span>
        <span class="reveal-text">WORKS</span>
      </a>
      <a href="about.html" class="reveal-link text-base sm:text-8xl font-normal tracking-[0.12em]">
        <span class="reveal-bg"></span>
        <span class="reveal-text">ABOUT</span>
      </a>
    </nav>
  </main>

  <script>
    // video3 をクリックすると video1 を重ねて表示／再クリックで非表示
    const videoStack = document.getElementById('videoStack');
    const overlayVideo = document.getElementById('overlayVideo');
    if (videoStack && overlayVideo) {
      videoStack.addEventListener('click', () => {
        overlayVideo.classList.toggle('opacity-0');
      });
    }
  </script>

  <script>
    // スマホ／タッチ環境では、画面内に入ったら白背景を表示
    const isTouch = window.matchMedia('(hover: none)').matches
                 || window.matchMedia('(max-width: 768px)').matches;

    if (isTouch && 'IntersectionObserver' in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in-view');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.6 });

      document.querySelectorAll('.reveal-link').forEach((el) => io.observe(el));
    }
  </script>

</body>
</html>
