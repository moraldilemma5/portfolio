        <script>

            
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");
const modalVideo = document.getElementById("modalVideo");
const modalText = document.getElementById("modalText");
const modalLink = document.getElementById("modalLink");
const closeModal = document.getElementById("closeModal");
const modalContent = document.getElementById("modalContent");
const workImages = document.querySelectorAll(".work-item img");
const workVideos = document.querySelectorAll(".work-video");
const protectedMedia = document.querySelectorAll(".work-item img, .work-item video, #modalImg, #modalVideo");

function resetModalImageState() {
  modalImg.classList.remove("is-flippable", "is-flipping-to-back", "is-flipping-to-front");
  modalImg.style.transform = "";
  delete modalImg.dataset.frontSrc;
  delete modalImg.dataset.backSrc;
  delete modalImg.dataset.side;
}

function openImageModal(img, parent) {
  resetModalImageState();

  modalImg.src = img.src;
  modalImg.classList.remove("hidden");

  if (img.dataset.frontSrc && img.dataset.backSrc) {
    modalImg.dataset.frontSrc = img.dataset.frontSrc;
    modalImg.dataset.backSrc = img.dataset.backSrc;
    modalImg.dataset.side = "front";
    modalImg.classList.add("is-flippable");
  }

  modalVideo.classList.add("hidden");
  modalVideo.pause();

  modalText.textContent = parent.dataset.caption || "";
  updateModalLink(parent);

  modal.classList.remove("hidden");
  modal.classList.add("flex");
}

function flipModalImage() {
  const frontSrc = modalImg.dataset.frontSrc;
  const backSrc = modalImg.dataset.backSrc;

  if (
    !frontSrc ||
    !backSrc ||
    modalImg.classList.contains("is-flipping-to-back") ||
    modalImg.classList.contains("is-flipping-to-front")
  ) {
    return;
  }

  const nextSide = modalImg.dataset.side === "back" ? "front" : "back";
  const nextSrc = nextSide === "back" ? backSrc : frontSrc;

  modalImg.classList.remove("is-flipping-to-back", "is-flipping-to-front");
  modalImg.classList.add(nextSide === "back" ? "is-flipping-to-back" : "is-flipping-to-front");

  window.setTimeout(() => {
    modalImg.src = nextSrc;
    modalImg.dataset.side = nextSide;
  }, 350);
}

function loadDeferredMedia(category) {
  document
    .querySelectorAll(`[data-category="${category}"] img[data-src], [data-category="${category}"] video[data-src]`)
    .forEach(media => {
      if (media.dataset.loaded === "true") return;

      media.src = media.dataset.src;
      media.dataset.loaded = "true";

      if (media.tagName === "VIDEO") {
        media.load();
      }
    });
}

function updateModalLink(parent) {
  const link = parent?.dataset.link;

  if (link) {
    modalLink.href = link;
    modalLink.classList.remove("hidden");
    return;
  }

  modalLink.href = "#";
  modalLink.classList.add("hidden");
}

protectedMedia.forEach(media => {
  media.setAttribute("draggable", "false");

  media.addEventListener("contextmenu", (e) => {
    e.preventDefault();
  });

  media.addEventListener("dragstart", (e) => {
    e.preventDefault();
  });
});

document.addEventListener("contextmenu", (e) => {
  if (e.target.closest(".work-item, #modalContent")) {
    e.preventDefault();
  }
});

document.addEventListener("keydown", (e) => {
  const key = e.key.toLowerCase();
  const blockedSave = (e.ctrlKey || e.metaKey) && key === "s";
  const blockedDevtools = e.key === "F12" || ((e.ctrlKey || e.metaKey) && e.shiftKey && ["i", "j", "c", "s"].includes(key));

  if (blockedSave || blockedDevtools) {
    e.preventDefault();
  }
});


workImages.forEach((img, index) => {
  img.decoding = "async";
  if (index > 2) {
    img.loading = "lazy";
  }

  img.addEventListener("click", () => {
    const parent = img.closest(".work-item");
    openImageModal(img, parent);
  });
});

modalImg.addEventListener("click", () => {
  if (!modalImg.classList.contains("is-flippable")) return;
  flipModalImage();
});

modalImg.addEventListener("animationend", () => {
  if (!modalImg.classList.contains("is-flippable")) return;

  modalImg.classList.remove("is-flipping-to-back", "is-flipping-to-front");
  modalImg.style.transform = "rotateY(0deg)";
});


workVideos.forEach(video => {
  video.addEventListener("click", () => {

    const parent = video.closest(".work-item");
    resetModalImageState();

    modalVideo.src = video.src;
    modalVideo.classList.remove("hidden");

    modalImg.classList.add("hidden");

    modalText.textContent = parent.dataset.caption || "";
    updateModalLink(parent);

    modal.classList.remove("hidden");
    modal.classList.add("flex");

    modalVideo.play();
  });
});

function syncVisibleVideos() {
  workVideos.forEach(video => {
    const isHidden = video.closest(".work-item")?.style.display === "none";

    if (isHidden) {
      video.pause();
      return;
    }

    const playPromise = video.play();
    if (playPromise && typeof playPromise.catch === "function") {
      playPromise.catch(() => {});
    }
  });
}


function closeModalFunc() {
  modal.classList.add("hidden");
  modalVideo.pause();
  modalLink.classList.add("hidden");
  resetModalImageState();
}

closeModal.addEventListener("click", closeModalFunc);

modal.addEventListener("click", (e) => {
  if (!modalContent.contains(e.target) && e.target !== closeModal) {
    closeModalFunc();
  }
});


const buttons = document.querySelectorAll(".filter-btn");
const items = document.querySelectorAll(".work-item, [data-category]");

buttons.forEach(button => {
  button.addEventListener("click", (e) => {

    const filter = button.dataset.filter;
    if (!filter) return;

    e.preventDefault();
    // 選択中のカテゴリを記憶（リロードしても photo に戻らないように）
    try { localStorage.setItem('worksFilter', filter); } catch (err) {}
    try { history.replaceState(null, '', '?filter=' + filter); } catch (err) {}
    loadDeferredMedia(filter);

    buttons.forEach(btn => btn.classList.remove("active"));
    button.classList.add("active");

    items.forEach(item => {
      if (filter === "all" || item.dataset.category === filter) {
        item.style.display = "";
      } else {
        item.style.display = "none";
      }
    });

    syncVisibleVideos();

  });
});

// URL の ?filter=（例：works.html?filter=video）があればそのフィルターで初期表示
// 最後に表示したカテゴリを記憶し、リロードしても photo に戻らないようにする
let savedFilter = null;
try { savedFilter = localStorage.getItem('worksFilter'); } catch (err) {}
const initialFilter = new URLSearchParams(location.search).get('filter')
                   || savedFilter
                   || 'photo';
const initialBtn = document.querySelector(`[data-filter="${initialFilter}"]`)
                || document.querySelector('[data-filter="photo"]');
initialBtn.click();
        </script>

        <script>
          // ハンバーガーメニュー（右からスライド）
          const menuToggle = document.getElementById('menuToggle');
          const menuOverlay = document.getElementById('menuOverlay');
          const menuBackdrop = document.getElementById('menuBackdrop');
          function setMenu(open) {
            document.body.classList.toggle('menu-open', open);
            menuOverlay.classList.toggle('translate-x-full', !open);
            menuBackdrop.classList.toggle('opacity-0', !open);
            menuBackdrop.classList.toggle('pointer-events-none', !open);
          }
          function closeMenu() { setMenu(false); }
          menuToggle.addEventListener('click', () => setMenu(!document.body.classList.contains('menu-open')));
          menuBackdrop.addEventListener('click', closeMenu);

          // WORKS ツリーの開閉
          const worksToggle = document.getElementById('worksToggle');
          const submenu = document.querySelector('#menuOverlay .submenu');
          const caret = document.querySelector('#menuOverlay .tree-caret');
          worksToggle.addEventListener('click', () => {
            submenu.classList.toggle('open');
            caret.classList.toggle('open');
          });

          // サブ項目：works ページ内なのでその場でフィルター
          document.querySelectorAll('#menuOverlay [data-filter-link]').forEach((a) => {
            a.addEventListener('click', (e) => {
              const btn = document.querySelector(`.filter-btn[data-filter="${a.dataset.filterLink}"]`);
              if (btn) {
                e.preventDefault();
                btn.click();
                closeMenu();
              }
            });
          });
        </script>
